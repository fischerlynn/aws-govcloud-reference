# ---------------------------------------------------------------------------
# FischerLynn LLC -- aws-govcloud-reference (standalone public repo)
# Terraform CI/CD for the serverless AWS reference (Lambda + API GW + DynamoDB + S3)
# ---------------------------------------------------------------------------
# Patterns demonstrated (named for reviewers):
#   1. OIDC (keyless auth)    -- GitHub OIDC token -> STS AssumeRole. NO static
#                                AWS keys in GitHub secrets.
#   2. Policy-as-code gates   -- tfsec + checkov fail the build on findings.
#   3. Plan-before-apply      -- PRs plan + comment the diff; never apply.
#   4. Environment promotion  -- apply only on push to main, gated behind the
#                                "production" GitHub Environment (manual approval).
# Action versions are PINNED. Account 981257813928 / us-east-1.
# OIDC trust is scoped to repo:fischerlynn/aws-govcloud-reference (via tfvars).
# ---------------------------------------------------------------------------

name: terraform

on:
  pull_request:
    branches: [main]
    paths: ["terraform/**", ".github/workflows/terraform.yml"]
  push:
    branches: [main]
    paths: ["terraform/**", ".github/workflows/terraform.yml"]

permissions:
  contents: read

concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: terraform

env:
  TF_VERSION: "1.15.5"
  AWS_REGION: "us-east-1"
  AWS_DEPLOY_ROLE_ARN: "arn:aws:iam::981257813928:role/aws-govcloud-reference-dev-gha-deploy"

jobs:
  validate:
    name: fmt / validate / scan / plan
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      pull-requests: write
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - name: Terraform fmt (check)
        id: fmt
        run: terraform fmt -check -recursive
      - name: Configure AWS credentials (OIDC, keyless)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-tf-plan-${{ github.run_id }}
      - name: Terraform init
        run: terraform init -input=false
      - name: Terraform validate
        run: terraform validate -no-color
      - name: tfsec
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          working_directory: terraform
          soft_fail: false
      - name: checkov
        uses: bridgecrewio/checkov-action@v12.2347.0
        with:
          directory: terraform
          framework: terraform
          quiet: true
          soft_fail: false
      - name: Terraform plan
        id: plan
        run: terraform plan -input=false -no-color -out=tfplan
        continue-on-error: true
      - name: Render plan
        if: always()
        run: terraform show -no-color tfplan > plan.txt || true
      - name: Comment plan on PR
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let plan = '';
            try { plan = fs.readFileSync('terraform/plan.txt', 'utf8'); }
            catch (e) { plan = 'No plan output.'; }
            const max = 60000;
            if (plan.length > max) plan = plan.slice(0, max) + '\n... (truncated) ...';
            const body = [
              '### Terraform Plan',
              '',
              `fmt: \`${{ steps.fmt.outcome }}\` · plan: \`${{ steps.plan.outcome }}\``,
              '',
              '<details><summary>Show plan</summary>',
              '',
              '```hcl',
              plan,
              '```',
              '</details>',
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number, body,
            });
      - name: Fail if plan errored
        if: steps.plan.outcome == 'failure'
        run: exit 1

  apply:
    name: apply (production)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production   # require a reviewer in repo Settings > Environments
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - name: Configure AWS credentials (OIDC, keyless)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-tf-apply-${{ github.run_id }}
      - name: Terraform init
        run: terraform init -input=false
      - name: Terraform apply
        run: terraform apply -input=false -auto-approve
